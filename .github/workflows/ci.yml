name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLECK_EDITOR_PREFLIGHT_SELECTOR: '^FleckAppTests\.(doubleClick.*|tripleClick.*|shiftClickExtends.*|clickInsideLinkLabel.*|deletingAWholeSelectedLink.*|movingTheCaretNeverChangesAMarker.*)$'

jobs:
  tls-startup-diagnostic:
    name: Diagnostic-only / TLS fixture startup in ordinary graph
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FLECK_BUILD_IDENTITY_MODE: ci-unverified
      PYTHONDONTWRITEBYTECODE: "1"
      FLECK_TEST_APPKIT_WATCHDOG_SECONDS: "4800"
    steps:
      - name: Keep the runner display awake for AppKit tests
        run: |
          sudo -n pmset -a displaysleep 0 sleep 0
          pmset -g | grep -E '^ (displaysleep|sleep) '
      - name: Check out repository (actions/checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'version=%s\n' "$(cat VERSION)"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Select qualified Xcode on GitHub-hosted macOS
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode_26.4.1.app/Contents/Developer
          test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version)" = $'Xcode 26.4.1\nBuild version 17E202'
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          printf 'Runner OS: %s; architecture: %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          xcodebuild -version
          swift --version
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Check product version
        run: python3 -B Scripts/fleck-build-identity.py check
      - name: Test ordinary graph
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
          FLECK_TEST_APPKIT_PREFLIGHT_SELECTOR: ${{ env.FLECK_EDITOR_PREFLIGHT_SELECTOR }}
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          Scripts/run-nonempty-swift-tests.sh '^.+$'
